<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="How the skill works: Learn, Audit, Fix, Apply, Stay safe">
  <defs>
    <style>
      .march { stroke-dasharray: 10 8; animation: march 1.1s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -18; } }
      .glow { animation: glow 2.4s ease-in-out infinite; }
      .glow2 { animation: glow 2.4s ease-in-out infinite; animation-delay: 0.5s; }
      .glow3 { animation: glow 2.4s ease-in-out infinite; animation-delay: 1s; }
      .glow4 { animation: glow 2.4s ease-in-out infinite; animation-delay: 1.5s; }
      .glow5 { animation: glow 2.4s ease-in-out infinite; animation-delay: 2s; }
      @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .pop { opacity: 0; animation: pop 0.7s ease-out forwards; }
      .pop1 { animation-delay: 0.1s; }
      .pop2 { animation-delay: 0.35s; }
      .pop3 { animation-delay: 0.6s; }
      .pop4 { animation-delay: 0.85s; }
      .pop5 { animation-delay: 1.1s; }
      @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0px); } }
    </style>
  </defs>
  <rect width="1200" height="240" fill="#FAFAF9"/>
  <line class="march" x1="200" y1="90" x2="330" y2="90" stroke="#F97316" stroke-width="3"/>
  <line class="march" x1="440" y1="90" x2="570" y2="90" stroke="#F97316" stroke-width="3"/>
  <line class="march" x1="680" y1="90" x2="810" y2="90" stroke="#F97316" stroke-width="3"/>
  <line class="march" x1="920" y1="90" x2="1050" y2="90" stroke="#F97316" stroke-width="3"/>
  <polygon points="330,82 348,90 330,98" fill="#F97316"/>
  <polygon points="570,82 588,90 570,98" fill="#F97316"/>
  <polygon points="810,82 828,90 810,98" fill="#F97316"/>
  <polygon points="1050,82 1068,90 1050,98" fill="#F97316"/>
  <g class="pop pop1">
    <circle class="glow" cx="140" cy="90" r="52" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/>
    <text x="140" y="104" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#C2410C">1</text>
    <text x="140" y="178" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="bold" fill="#1C1917">Learn</text>
    <text x="140" y="204" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#78716C">Rules, myths, history</text>
  </g>
  <g class="pop pop2">
    <circle class="glow2" cx="380" cy="90" r="52" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/>
    <text x="380" y="104" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#C2410C">2</text>
    <text x="380" y="178" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="bold" fill="#1C1917">Audit</text>
    <text x="380" y="204" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#78716C">Quick check, deep crawl</text>
  </g>
  <g class="pop pop3">
    <circle class="glow3" cx="620" cy="90" r="52" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/>
    <text x="620" y="104" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#C2410C">3</text>
    <text x="620" y="178" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="bold" fill="#1C1917">Fix</text>
    <text x="620" y="204" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#78716C">Every failure, in order</text>
  </g>
  <g class="pop pop4">
    <circle class="glow4" cx="860" cy="90" r="52" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/>
    <text x="860" y="104" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#C2410C">4</text>
    <text x="860" y="178" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="bold" fill="#1C1917">Apply</text>
    <text x="860" y="204" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#78716C">Once, when ready</text>
  </g>
  <g class="pop pop5">
    <circle class="glow5" cx="1100" cy="90" r="52" fill="#FFF7ED" stroke="#F97316" stroke-width="3"/>
    <text x="1100" y="104" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="34" font-weight="bold" fill="#C2410C">5</text>
    <text x="1100" y="178" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="bold" fill="#1C1917">Stay safe</text>
    <text x="1100" y="204" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#78716C">Monthly review, no risks</text>
  </g>
</svg>
