<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-label="Terminal: running the audit scripts">
  <defs>
    <style>
      .line { opacity: 0; animation: show 0.6s ease-out forwards; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 1.1s; }
      .l3 { animation-delay: 1.9s; }
      .l4 { animation-delay: 2.7s; }
      @keyframes show { from { opacity: 0; } to { opacity: 1; } }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="760" height="190" rx="14" fill="#0C0A09"/>
  <rect x="1" y="1" width="758" height="188" rx="13" fill="none" stroke="#44403C" stroke-width="2"/>
  <circle cx="30" cy="26" r="7" fill="#F87171"/>
  <circle cx="54" cy="26" r="7" fill="#FBBF24"/>
  <circle cx="78" cy="26" r="7" fill="#4ADE80"/>
  <text x="110" y="31" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#A8A29E">adsense-approval-skill</text>
  <text class="line l1" x="28" y="72" font-family="Consolas, Menlo, monospace" font-size="16" fill="#4ADE80">$ <tspan fill="#E7E5E4">python3 scripts/site_audit.py https://example.com</tspan></text>
  <text class="line l2" x="28" y="102" font-family="Consolas, Menlo, monospace" font-size="16" fill="#FBBF24">[OK] 0 blockers, 1 warning. Basics pass.</text>
  <text class="line l3" x="28" y="132" font-family="Consolas, Menlo, monospace" font-size="16" fill="#4ADE80">$ <tspan fill="#E7E5E4">python3 scripts/deep_audit.py https://example.com --json report.json</tspan></text>
  <text class="line l4" x="28" y="162" font-family="Consolas, Menlo, monospace" font-size="16" fill="#FBBF24">[OK] 51 pages, 0 failures. Human audit still required.</text>
  <rect class="cursor" x="28" y="172" width="10" height="4" fill="#4ADE80"/>
</svg>
