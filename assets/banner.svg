<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AdSense Approval Mastery">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1917"/>
      <stop offset="0.55" stop-color="#292524"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="bgB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2D12"/>
      <stop offset="0.5" stop-color="#1C1917"/>
      <stop offset="1" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <style>
      .bgB { animation: crossfade 9s ease-in-out infinite alternate; }
      @keyframes crossfade { from { opacity: 0; } to { opacity: 0.85; } }
      .float1 { animation: floaty 7s ease-in-out infinite; }
      .float2 { animation: floaty 9s ease-in-out infinite; animation-delay: 1.2s; }
      .float3 { animation: floaty 8s ease-in-out infinite; animation-delay: 0.6s; }
      @keyframes floaty { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-16px); } }
      .rise { opacity: 0; animation: rise 1s ease-out forwards; }
      .rise1 { animation-delay: 0.2s; }
      .rise2 { animation-delay: 0.55s; }
      .rise3 { animation-delay: 0.9s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0px); } }
      .draw { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1.1s ease-out 0.7s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      .shine { animation: shine 3.2s linear infinite; }
      @keyframes shine { 0% { stroke-dashoffset: 240; } 100% { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bgA)"/>
  <rect class="bgB" width="1200" height="360" fill="url(#bgB)"/>
  <circle class="float1" cx="1020" cy="70" r="46" fill="#F97316" opacity="0.16"/>
  <circle class="float2" cx="1100" cy="250" r="70" fill="#FBBF24" opacity="0.10"/>
  <circle class="float3" cx="920" cy="300" r="26" fill="#FFFFFF" opacity="0.08"/>
  <circle class="float2" cx="80" cy="300" r="34" fill="#F97316" opacity="0.12"/>
  <circle cx="980" cy="180" r="86" fill="none" stroke="#F97316" stroke-width="2" opacity="0.35"/>
  <circle class="pulse" cx="980" cy="180" r="64" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <path class="draw" d="M 948 180 L 972 204 L 1016 158" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="rise rise1" x="80" y="140" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="bold" fill="#FFFFFF">AdSense Approval</text>
  <text class="rise rise1" x="80" y="202" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="bold" fill="url(#accent)">Mastery</text>
  <text class="rise rise2" x="80" y="248" font-family="Verdana, Geneva, sans-serif" font-size="21" fill="#D6D3D1">Learn the rules. Audit the site. Fix the rejection. Stay safe.</text>
  <text class="rise rise3" x="80" y="292" font-family="Verdana, Geneva, sans-serif" font-size="16" fill="#A8A29E">Honest, sourced, and myth-free. No approval is promised. Google decides.</text>
  <line class="shine" x1="80" y1="318" x2="520" y2="318" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 180"/>
</svg>
